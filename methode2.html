<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHS Passeport Numérique - 3DEXPERIENCE</title>
    <style>
        :root {
            /* Charte Graphique Dassault Systèmes (3DS) - Thème Clair Uni */
            --ds-blue-dark: #002C4B;
            --ds-blue-primary: #005386;
            --ds-blue-light: #0076BA;
            
            /* Neutres & Fonds */
            --bg-main: #F5F5F7;
            --bg-card: #FFFFFF;
            --bg-pill-bar: #E5E8ED;
            --bg-input: #F0F2F5;
            --text-main: #1D1D1F;
            --text-muted: #6E6E73;

            /* Couleurs fonctionnelles */
            --success: #28894B;
            --warning: #E67E22;
            --danger: #D12F2F;

            /* Ombres douces (sans aucune bordure) */
            --shadow-soft: 0 4px 14px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 10px 22px rgba(0, 44, 75, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: '3ds', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            overflow-x: hidden;
        }

        /* =========================================================
           1. EN-TÊTE ÉPURÉ UNI (SANS BORDURE)
           ========================================================= */
        .header {
            background: var(--bg-card);
            padding: 18px 22px;
            border-radius: 18px;
            border: none;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: var(--shadow-soft);
        }

        .piece-title-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ref-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--text-muted);
        }

        .ref-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .ref-item strong {
            color: var(--ds-blue-primary);
            font-weight: 700;
        }

        .cad-value {
            font-family: Consolas, monospace;
            background: var(--bg-input);
            padding: 3px 10px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            color: var(--text-main);
        }

        .csv-dot {
            font-size: 12px;
            color: var(--text-muted);
        }

        .piece-title-box h1 {
            font-size: 22px;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 700;
            background: var(--bg-input);
            color: var(--text-main);
            border: none;
        }

        /* =========================================================
           2. BARRE D'ONGLETS EN PILULE (STYLE CAPSULE SANS BORDURE)
           ========================================================= */
        .tabs-pill-container {
            background: var(--bg-pill-bar);
            padding: 5px;
            border-radius: 999px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 11px 20px;
            background: transparent;
            color: var(--text-main);
            border: none;
            outline: none;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(1.02);
        }

        .tab-btn.active {
            background: var(--ds-blue-primary);
            color: #FFFFFF;
            box-shadow: 0 2px 8px rgba(0, 83, 134, 0.25);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* =========================================================
           3. INDICATEURS CLÉS UNIS (SANS BORDURE)
           ========================================================= */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .metric-card {
            background: var(--bg-card);
            padding: 14px 12px;
            border-radius: 14px;
            border: none;
            text-align: center;
            box-shadow: var(--shadow-soft);
        }

        .metric-card .label {
            font-size: 10.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .metric-card .value {
            font-size: 15.5px;
            font-weight: 700;
            margin-top: 5px;
            color: var(--ds-blue-primary);
        }

        /* =========================================================
           4. BOUTONS CRITÈRES COMPACTS (x0.75, SANS "+", TEXTE DS-BLUE-PRIMARY)
           ========================================================= */
        .criteria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .crit-btn {
            background: var(--bg-card);
            border: none;
            outline: none;
            padding: 12px 13px;
            border-radius: 14px;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: var(--shadow-soft);
            transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
                        background-color 0.22s ease,
                        box-shadow 0.22s ease,
                        color 0.22s ease;
        }

        .crit-btn:hover {
            transform: scale(1.045);
            box-shadow: var(--shadow-hover);
            z-index: 2;
        }

        .crit-btn.active {
            background: var(--ds-blue-primary);
            box-shadow: 0 6px 16px rgba(0, 83, 134, 0.28);
        }

        .crit-btn .crit-num {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .crit-btn .crit-name {
            font-size: 12.5px;
            font-weight: 700;
            line-height: 1.25;
            color: var(--ds-blue-primary);
            transition: color 0.2s ease;
        }

        .crit-btn.active .crit-num {
            color: rgba(255, 255, 255, 0.8);
        }

        .crit-btn.active .crit-name {
            color: #FFFFFF;
        }

        /* =========================================================
           5. ZONE DE DÉTAIL DU CRITÈRE (UNIE SANS BORDURE)
           ========================================================= */
        .detail-box {
            background: var(--bg-card);
            border: none;
            border-radius: 18px;
            padding: 20px 22px;
            min-height: 110px;
            box-shadow: var(--shadow-soft);
        }

        .detail-box h3 {
            color: var(--ds-blue-primary);
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .detail-box p {
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-line;
            color: var(--text-main);
        }

        /* =========================================================
           6. ONGLET DIAGNOSTIC & ONGLET BLOC-NOTE (UNIS SANS BORDURE)
           ========================================================= */
        .diag-section {
            background: var(--bg-card);
            border: none;
            border-radius: 18px;
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-soft);
        }

        .diag-section h3 {
            color: var(--ds-blue-primary);
            margin-bottom: 10px;
            font-size: 15px;
            font-weight: 700;
        }

        .alert-box {
            background: #FEE2E2;
            border: none;
            color: #991B1B;
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 14px;
            font-size: 13.5px;
            font-weight: 600;
        }

        .steps-list {
            padding-left: 20px;
            line-height: 1.7;
            font-size: 14px;
        }

        .state-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .state-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            outline: none;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            color: #FFFFFF;
            font-size: 13px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .state-btn:hover {
            transform: scale(1.03);
            opacity: 0.92;
        }

        .btn-ok { background: var(--success); }
        .btn-warn { background: var(--warning); }
        .btn-err { background: var(--danger); }

        /* Bloc-note */
        .note-form {
            background: var(--bg-card);
            padding: 18px 20px;
            border-radius: 18px;
            border: none;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: var(--shadow-soft);
        }

        .note-form input, .note-form select, .note-form textarea {
            width: 100%;
            padding: 11px 14px;
            border-radius: 12px;
            border: none;
            background: var(--bg-input);
            color: var(--text-main);
            font-size: 13.5px;
            outline: none;
        }

        .note-form input:focus, .note-form select:focus, .note-form textarea:focus {
            background: #E8ECF2;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: var(--ds-blue-primary);
            color: #FFFFFF;
            border: none;
            outline: none;
            padding: 11px 20px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            transition: transform 0.2s ease, background-color 0.2s ease;
