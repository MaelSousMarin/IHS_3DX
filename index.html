<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail IHS — 3DEXPERIENCE</title>
    <style>
        :root {
            /* Charte Graphique Dassault Systèmes (3DS) - Thème Clair Uni */
            --ds-blue-dark: #002C4B;
            --ds-blue-primary: #005386;
            --ds-blue-light: #0076BA;

            /* Neutres & Fonds */
            --bg-main: #F5F5F7;
            --bg-card: #FFFFFF;
            --bg-input: #F0F2F5;
            --text-main: #1D1D1F;
            --text-muted: #6E6E73;

            /* Ombres douces (sans aucune bordure) */
            --shadow-soft: 0 4px 14px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 10px 22px rgba(0, 44, 75, 0.14);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: '3ds', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* En-tête épuré uni (sans bordure) */
        .header {
            background: var(--bg-card);
            padding: 22px 26px;
            border-radius: 18px;
            border: none;
            box-shadow: var(--shadow-soft);
            text-align: center;
        }

        .header .subtitle {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--ds-blue-primary);
            margin-bottom: 6px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        .header p {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .repo-meta {
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .meta-pill {
            background: var(--bg-input);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 600;
        }

        .meta-pill.primary {
            color: var(--ds-blue-primary);
        }

        /* Grille dynamique des pages du dépôt */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
        }

        .nav-btn {
            background: var(--bg-card);
            border: none;
            outline: none;
            border-radius: 16px;
            padding: 22px 20px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            box-shadow: var(--shadow-soft);
            transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
                        background-color 0.22s ease,
                        box-shadow 0.22s ease,
                        color 0.22s ease;
        }

        .nav-btn:hover {
            background: var(--ds-blue-primary);
            transform: scale(1.045);
            box-shadow: var(--shadow-hover);
        }

        .nav-btn:active {
            transform: scale(0.99);
            background: var(--ds-blue-dark);
        }

        .nav-num {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
            transition: color 0.2s ease;
        }

        .nav-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--ds-blue-primary);
            word-break: break-word;
            transition: color 0.2s ease;
        }

        .nav-desc {
            font-size: 12.5px;
            line-height: 1.4;
            color: var(--text-muted);
            margin-top: 2px;
            transition: color 0.2s ease;
        }

        .nav-file {
            font-family: Consolas, monospace;
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-input);
            padding: 3px 8px;
            border-radius: 6px;
            align-self: flex-start;
            margin-top: 6px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .nav-btn:hover .nav-num,
        .nav-btn:hover .nav-desc {
            color: rgba(255, 255, 255, 0.82);
        }

        .nav-btn:hover .nav-title {
            color: #FFFFFF;
        }

        .nav-btn:hover .nav-file {
            background: rgba(255, 255, 255, 0.18);
            color: #FFFFFF;
        }

        .status-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13.5px;
            box-shadow: var(--shadow-soft);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="subtitle">3DEXPERIENCE — Passeport Numérique</div>
            <h1>Menu Principal</h1>
            <p>Sélectionnez une page du dépôt pour y accéder</p>
            <div class="repo-meta">
                <span class="meta-pill primary" id="badgeRepo">MaelSousMarin/IHS_3DX</span>
                <span class="meta-pill" id="badgeStatut">Lecture du dépôt...</span>
            </div>
        </div>

        <div class="nav-grid" id="navGrid">
            <div class="status-card">Chargement des pages disponibles dans le dépôt...</div>
        </div>
    </div>

    <script>
        /* =========================================================================
           1. CONFIGURATION DU DÉPÔT & DESCRIPTIONS OPTIONNELLES DES PAGES CONNUES
           ========================================================================= */
        const DEFAULT_OWNER = "MaelSousMarin";
        const DEFAULT_REPO = "IHS_3DX";

        // Descriptions personnalisées pour les pages connues (toute autre page .html est ajoutée automatiquement)
        const DESCRIPTIONS_CONNUES = {
            "ArbreEtAnimationM2.html": {
                titre: "Arbre 3D & Animations",
                desc: "Hiérarchie de l'assemblage et pilotage des séquences 3D"
            },
            "proprieteM2.html": {
                titre: "Propriétés (Méthode 2)",
                desc: "Passeport CSV, diagnostic par instance et bloc-note avec captures"
            },
            "methode1.html": {
                titre: "Méthode 1",
                desc: "Passeport technique via métadonnées PLM"
            },
            "methode2.html": {
                titre: "Méthode 2",
                desc: "Passeport technique via fichiers CSV"
            },
            "animations.html": {
                titre: "Animations",
                desc: "Pilotage des séquences d'assemblage 3D"
            }
        };

        // Liste de secours utilisée uniquement si l'API GitHub est inaccessible
        const PAGES_SECOURS = [
            "ArbreEtAnimationM2.html",
            "proprieteM2.html",
            "methode1.html",
            "methode2.html",
            "animations.html"
        ];

        function detecterDepotGitHub() {
            const host = window.location.hostname || "";
            if (host.endsWith(".github.io")) {
                const owner = host.replace(".github.io", "");
                const segments = window.location.pathname.split("/").filter(Boolean);
                const repo = segments.length > 0 ? segments[0] : DEFAULT_REPO;
                return { owner: owner || DEFAULT_OWNER, repo: repo || DEFAULT_REPO };
            }
            return { owner: DEFAULT_OWNER, repo: DEFAULT_REPO };
        }

        function formaterTitreDepuisFichier(nomFichier) {
            if (DESCRIPTIONS_CONNUES[nomFichier]) {
                return DESCRIPTIONS_CONNUES[nomFichier].titre;
            }
            const sansExt = nomFichier.replace(/\.html?$/i, "");
            return sansExt
                .replace(/[_-]+/g, " ")
                .replace(/([a-z])([A-Z])/g, "$1 $2")
                .trim();
        }

        function formaterDescriptionDepuisFichier(nomFichier) {
            if (DESCRIPTIONS_CONNUES[nomFichier]) {
                return DESCRIPTIONS_CONNUES[nomFichier].desc;
            }
            return "Page HTML détectée dans le dépôt";
        }

        function afficherPages(listeFichiers, modeSecours) {
            const grille = document.getElementById("navGrid");
            const badgeStatut = document.getElementById("badgeStatut");

            if (!listeFichiers || listeFichiers.length === 0) {
                grille.innerHTML = "<div class='status-card'>Aucune page HTML trouvée dans ce dépôt.</div>";
                badgeStatut.textContent = "0 page détectée";
                return;
            }

            const total = listeFichiers.length;
            const libelle = total > 1 ? total + " pages détectées" : total + " page détectée";
            badgeStatut.textContent = modeSecours ? libelle + " (mode secours)" : libelle;

            grille.innerHTML = "";

            listeFichiers.forEach((nomFichier, index) => {
                const num = String(index + 1).padStart(2, "0");
                const titre = formaterTitreDepuisFichier(nomFichier);
                const desc = formaterDescriptionDepuisFichier(nomFichier);

                const lien = document.createElement("a");
                lien.className = "nav-btn";
                lien.href = encodeURI(nomFichier);

                const spanNum = document.createElement("span");
                spanNum.className = "nav-num";
                spanNum.textContent = "Page " + num;

                const spanTitre = document.createElement("span");
                spanTitre.className = "nav-title";
                spanTitre.textContent = titre;

                const spanDesc = document.createElement("span");
                spanDesc.className = "nav-desc";
                spanDesc.textContent = desc;

                const spanFile = document.createElement("span");
                spanFile.className = "nav-file";
                spanFile.textContent = nomFichier;

                lien.appendChild(spanNum);
                lien.appendChild(spanTitre);
                lien.appendChild(spanDesc);
                lien.appendChild(spanFile);

                grille.appendChild(lien);
            });
        }

        async function chargerPagesDuDepot() {
            const { owner, repo } = detecterDepotGitHub();
            document.getElementById("badgeRepo").textContent = owner + "/" + repo;

            const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/`;

            try {
                const reponse = await fetch(apiUrl, {
                    headers: { "Accept": "application/vnd.github.v3+json" }
                });
                if (!reponse.ok) throw new Error("HTTP " + reponse.status);

                const contenu = await reponse.json();
                if (!Array.isArray(contenu)) throw new Error("Format inattendu");

                const pagesHTML = contenu
                    .filter(item =>
                        item &&
                        item.type === "file" &&
                        /\.html?$/i.test(item.name) &&
                        item.name.toLowerCase() !== "index.html"
                    )
                    .map(item => item.name)
                    .sort((a, b) => a.localeCompare(b, "fr", { sensitivity: "base" }));

                afficherPages(pagesHTML, false);
            } catch (err) {
                afficherPages(PAGES_SECOURS, true);
            }
        }

        chargerPagesDuDepot();
    </script>

</body>
</html>
