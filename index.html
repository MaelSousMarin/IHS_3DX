<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Radar de réception 3DEXPERIENCE</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #f8fafc; padding: 15px; }
        .radar { background: #1e293b; border: 2px solid #38bdf8; padding: 15px; border-radius: 8px; margin-bottom: 12px; }
        .statut-attente { color: #facc15; font-size: 16px; font-weight: bold; }
        .statut-ok { color: #4ade80; font-size: 18px; font-weight: bold; }
        pre { background: #020617; padding: 10px; border-radius: 6px; color: #38bdf8; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>

    <div class="radar">
        <div id="etat" class="statut-attente">⏳ EN ATTENTE D'UN MESSAGE DE 3DEXPERIENCE...</div>
        <p>Dernier message capté :</p>
        <pre id="journal">Rien reçu pour l'instant.</pre>
    </div>

    <script>
        let compteur = 0;

        function afficherReception(source, donnees) {
            compteur++;
            const etat = document.getElementById("etat");
            etat.className = "statut-ok";
            etat.textContent = "✅ MESSAGE #" + compteur + " REÇU VIA : " + source;

            let texte = typeof donnees === "object" ? JSON.stringify(donnees, null, 2) : String(donnees);
            document.getElementById("journal").textContent = texte;
        }

        // Canal 1 : Standard window.postMessage (Creative Experience Web / Desktop)
        window.addEventListener("message", function (event) {
            afficherReception("window.message", event.data);
        }, false);

        // Canal 2 : document.message (utilisé par certaines versions du WebViewer)
        document.addEventListener("message", function (event) {
            afficherReception("document.message", event.data || event.detail);
        }, false);

        // Canal 3 : Fonction globale appelée par le mode Legacy de certains WebViewers 3DX
        window.onMessageReceived = function (msg) {
            afficherReception("window.onMessageReceived", msg);
        };
        window.receiveMessage = function (msg) {
            afficherReception("window.receiveMessage", msg);
        };
    </script>
</body>
</html>
