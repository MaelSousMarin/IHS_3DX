<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail IHS — 3DEXPERIENCE</title>
    <style>
        :root {
            /* Charte Graphique Dassault Systèmes (3DS) - Thème Clair Uni */
            --ds-blue-dark: #002C4B;
            --ds-blue-primary: #005386;
            --ds-blue-light: #0076BA;

            /* Neutres & Fonds */
            --bg-main: #F5F5F7;
            --bg-card: #FFFFFF;
            --bg-input: #F0F2F5;
            --text-main: #1D1D1F;
            --text-muted: #6E6E73;

            /* Ombres douces (sans aucune bordure) */
            --shadow-soft: 0 4px 14px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 10px 22px rgba(0, 44, 75, 0.14);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: '3ds', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* En-tête épuré uni (sans bordure) */
        .header {
            background: var(--bg-card);
            padding: 22px 26px;
            border-radius: 18px;
            border: none;
            box-shadow: var(--shadow-soft);
            text-align: center;
        }

        .header .subtitle {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--ds-blue-primary);
            margin-bottom: 6px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        .header p {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Grille des 3 boutons de navigation */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 14px;
        }

        .nav-btn {
            background: var(--bg-card);
            border: none;
            outline: none;
            border-radius: 16px;
            padding: 22px 20px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            box-shadow: var(--shadow-soft);
            transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
                        background-color 0.22s ease,
                        box-shadow 0.22s ease,
                        color 0.22s ease;
        }

        .nav-btn:hover {
            background: var(--ds-blue-primary);
            transform: scale(1.045);
            box-shadow: var(--shadow-hover);
        }

        .nav-btn:active {
            transform: scale(0.99);
            background: var(--ds-blue-dark);
        }

        .nav-num {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
            transition: color 0.2s ease;
        }

        .nav-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--ds-blue-primary);
            transition: color 0.2s ease;
        }

        .nav-desc {
            font-size: 12.5px;
            line-height: 1.4;
            color: var(--text-muted);
            margin-top: 2px;
            transition: color 0.2s ease;
        }

        .nav-btn:hover .nav-num,
        .nav-btn:hover .nav-desc {
            color: rgba(255, 255, 255, 0.82);
        }

        .nav-btn:hover .nav-title {
            color: #FFFFFF;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="subtitle">3DEXPERIENCE — Passeport Numérique</div>
            <h1>Menu Principal</h1>
            <p>Sélectionnez une interface pour y accéder</p>
        </div>

        <div class="nav-grid">
            <a href="methode1.html" class="nav-btn">
                <span class="nav-num">Page 01</span>
                <span class="nav-title">Méthode 1</span>
                <span class="nav-desc">Passeport technique via métadonnées PLM</span>
            </a>

            <a href="methode2.html" class="nav-btn">
                <span class="nav-num">Page 02</span>
                <span class="nav-title">Méthode 2</span>
                <span class="nav-desc">Passeport technique via fichiers CSV</span>
            </a>

            <a href="animations.html" class="nav-btn">
                <span class="nav-num">Page 03</span>
                <span class="nav-title">Animations</span>
                <span class="nav-desc">Pilotage des séquences d'assemblage 3D</span>
            </a>
        </div>
    </div>

</body>
</html>
