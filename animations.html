<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle des Animations 3DEXPERIENCE</title>
    <style>
        :root {
            --bg-page: #F5F5F7;
            --bg-card: #FFFFFF;
            --bg-subtle: #F0F2F5;
            --text-main: #1D1D1F;
            --text-muted: #6E6E73;
            --accent-blue: #005386;
            --shadow-soft: 0 4px 16px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 10px 24px rgba(0, 83, 134, 0.14);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* En-tête de la page */
        .header-card {
            background-color: var(--bg-card);
            border-radius: 20px;
            padding: 24px 28px;
            box-shadow: var(--shadow-soft);
            border: none;
        }

        .badges-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .badge {
            background-color: var(--bg-subtle);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            border: none;
        }

        .badge.primary {
            background-color: var(--accent-blue);
            color: #FFFFFF;
        }

        .header-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.4px;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Section de la liste des animations */
        .section-card {
            background-color: var(--bg-card);
            border-radius: 20px;
            padding: 24px 28px;
            box-shadow: var(--shadow-soft);
            border: none;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 18px;
        }

        /* Grille de boutons d'animations style cartes */
        .anim-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px;
        }

        .anim-btn {
            position: relative;
            background-color: var(--bg-subtle);
            color: var(--text-main);
            border: none;
            border-radius: 18px;
            padding: 20px 18px 44px 18px;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
                        background-color 0.22s ease,
                        color 0.22s ease,
                        box-shadow 0.22s ease;
            display: flex;
            flex-direction: column;
            gap: 6px;
            outline: none;
        }

        .anim-btn:hover {
            transform: scale(1.035);
            box-shadow: var(--shadow-hover);
        }

        .anim-btn.active {
            background-color: var(--accent-blue);
            color: #FFFFFF;
            box-shadow: var(--shadow-hover);
        }

        .anim-num {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            transition: color 0.22s ease;
        }

        .anim-btn.active .anim-num {
            color: rgba(255, 255, 255, 0.75);
        }

        .anim-name {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.3;
            word-break: break-word;
        }

        .anim-meta {
            font-size: 12px;
            color: var(--text-muted);
            transition: color 0.22s ease;
        }

        .anim-btn.active .anim-meta {
            color: rgba(255, 255, 255, 0.85);
        }

        /* Petit cercle d'action en bas à droite de chaque carte */
        .anim-action-icon {
            position: absolute;
            bottom: 14px;
            right: 14px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background-color: #FFFFFF;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            transition: background-color 0.22s ease, color 0.22s ease;
        }

        .anim-btn.active .anim-action-icon {
            background-color: rgba(255, 255, 255, 0.22);
            color: #FFFFFF;
        }

        .empty-state {
            background-color: var(--bg-subtle);
            border-radius: 16px;
            padding: 28px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- En-tête -->
        <header class="header-card">
            <div class="badges-row">
                <span class="badge primary" id="badgeCount">0 animation détectée</span>
                <span class="badge" id="badgeStatus">En attente de la scène 3DEXPERIENCE</span>
            </div>
            <h1 class="header-title">Contrôle des Animations</h1>
            <p class="header-subtitle" id="sousTitreHeader">
                Sélectionnez une animation de la scène pour lancer sa lecture.
            </p>
        </header>

        <!-- Liste des animations de la scène -->
        <section class="section-card">
            <div class="section-title">Animations de la scène</div>
            <div id="conteneurAnimations" class="anim-grid">
                <div class="empty-state">
                    Chargement de la liste des animations depuis 3DEXPERIENCE...
                </div>
            </div>
        </section>
    </div>

    <script>
        let listeAnimations = [];
        let animationActive = "";

        // 1. Afficher les cartes d'animations dans la grille
        function afficherListeAnimations() {
            const conteneur = document.getElementById("conteneurAnimations");
            const badgeCount = document.getElementById("badgeCount");

            const total = listeAnimations.length;
            badgeCount.textContent = total > 1
                ? total + " animations disponibles"
                : total + " animation disponible";

            if (total === 0) {
                conteneur.innerHTML = "<div class='empty-state'>Aucune animation trouvée dans la scène 3DEXPERIENCE.</div>";
                return;
            }

            conteneur.innerHTML = "";

            listeAnimations.forEach((anim, index) => {
                const nomAnim = typeof anim === "string" ? anim : anim.name;
                const dureeAnim = (anim && typeof anim.duration === "number" && anim.duration > 0)
                    ? anim.duration.toFixed(1) + " s"
                    : "Lancer au clic";

                const btn = document.createElement("button");
                btn.className = "anim-btn" + (nomAnim === animationActive ? " active" : "");

                const numFormate = String(index + 1).padStart(2, "0");

                btn.innerHTML =
                    "<span class='anim-num'>Animation " + numFormate + "</span>" +
                    "<span class='anim-name'>" + nomAnim + "</span>" +
                    "<span class='anim-meta'>" + dureeAnim + "</span>" +
                    "<span class='anim-action-icon'>+</span>";

                btn.onclick = function () {
                    lancerAnimation(nomAnim);
                };

                conteneur.appendChild(btn);
            });
        }

        // 2. Envoyer l'ordre de lancer l'animation à 3DEXPERIENCE au clic
        function lancerAnimation(nomAnimation) {
            animationActive = nomAnimation;
            afficherListeAnimations();

            document.getElementById("badgeStatus").textContent = "Lecture : " + nomAnimation;

            const message3DX = JSON.stringify({
                type: "PLAY_ANIMATION",
                name: nomAnimation
            });

            // Envoi vers la fenêtre parente 3DEXPERIENCE (WebViewer2DActor / WebPlayer)
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(message3DX, "*");
            }
            if (window.top && window.top !== window && window.top !== window.parent) {
                window.top.postMessage(message3DX, "*");
            }
            window.postMessage(message3DX, "*");
        }

        // 3. Traiter les messages envoyés par le beScript de 3DEXPERIENCE
        function traiterMessage3DX(donneesBrutes) {
            if (!donneesBrutes) return;

            try {
                const paquet = typeof donneesBrutes === "string"
                    ? JSON.parse(donneesBrutes)
                    : donneesBrutes;

                // Ignorer nos propres messages sortants
                if (paquet && (paquet.type === "PLAY_ANIMATION" || paquet.type === "WEB_READY")) {
                    return;
                }

                // Cas A : Réception d'un objet { type: "ANIMATION_LIST", animations: [...] }
                if (paquet && Array.isArray(paquet.animations)) {
                    listeAnimations = paquet.animations;
                    document.getElementById("badgeStatus").textContent = "Synchronisé avec la scène";
                    afficherListeAnimations();
                    return;
                }

                // Cas B : Réception directe d'un tableau d'animations [...]
                if (Array.isArray(paquet)) {
                    listeAnimations = paquet;
                    document.getElementById("badgeStatus").textContent = "Synchronisé avec la scène";
                    afficherListeAnimations();
                    return;
                }
            } catch (e) {
                // Si 3DEXPERIENCE envoie une liste séparée par des points-virgules ou virgules
                if (typeof donneesBrutes === "string") {
                    const texte = donneesBrutes.trim().replace(/^['"]|['"]$/g, "");
                    if (texte && !texte.includes("PLAY_ANIMATION")) {
                        listeAnimations = texte.split(/[;,]/).map(s => s.trim()).filter(Boolean);
                        document.getElementById("badgeStatus").textContent = "Synchronisé avec la scène";
                        afficherListeAnimations();
                    }
                }
            }
        }

        // Écoute des messages entrants depuis 3DEXPERIENCE (sendMessage)
        window.addEventListener("message", function (event) {
            if (!event.data) return;
            traiterMessage3DX(event.data);
        });

        document.addEventListener("message", function (event) {
            if (!event.data && !event.detail) return;
            traiterMessage3DX(event.data || event.detail);
        });

        // Signaler à 3DEXPERIENCE que la page web est prête à recevoir la liste
        window.addEventListener("load", function () {
            const msgPret = JSON.stringify({ type: "WEB_READY" });
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(msgPret, "*");
            }
        });
    </script>
</body>
</html>
